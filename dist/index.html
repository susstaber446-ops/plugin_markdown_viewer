<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket IDE - Markdown & Mermaid Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      line-height: 1.6;
      font-size: 14px;
    }
    .plugin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .plugin-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .plugin-status {
      font-size: 10px;
      color: #94a3b8;
    }
    h1, h2, h3, h4 { color: #f8fafc; margin-top: 20px; margin-bottom: 10px; font-weight: 600; line-height: 1.25; }
    h1 { font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; }
    h2 { font-size: 17px; }
    h3 { font-size: 15px; }
    p { margin-bottom: 14px; color: #cbd5e1; }
    a { color: #38bdf8; text-decoration: none; }
    ul, ol { margin-left: 20px; margin-bottom: 14px; color: #cbd5e1; }
    li { margin-bottom: 4px; }
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 12px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
    pre {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    pre code { background: transparent; padding: 0; color: #e2e8f0; }
    blockquote {
      border-left: 3px solid #38bdf8;
      padding: 6px 12px;
      color: #94a3b8;
      background: #111827;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
    }
    table { border-collapse: collapse; width: 100%; margin-bottom: 16px; font-size: 12.5px; }
    th, td { border: 1px solid #1e293b; padding: 8px 10px; text-align: left; }
    th { background: #1e293b; color: #f8fafc; font-weight: 600; }
    tr:nth-child(even) { background: #0f172a; }
    .mermaid {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    .mermaid svg { max-width: 100% !important; height: auto !important; }
    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="plugin-header">
    <div class="plugin-pill">
      <span>📖</span> MARKDOWN & MERMAID VIEWER
    </div>
    <div class="plugin-status" id="status">Ready</div>
  </div>

  <div id="content">
    <div id="placeholder">
      <p>Waiting for file content from Pocket IDE...</p>
    </div>
  </div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      fontFamily: '-apple-system, sans-serif'
    });

    function renderMarkdown(rawText) {
      if (!rawText || !rawText.trim()) {
        document.getElementById('content').innerHTML = '<p style="color:#64748b;font-style:italic;">Empty markdown file.</p>';
        return;
      }
      try {
        marked.setOptions({ gfm: true, breaks: true });
        var html = marked.parse(rawText);
        var container = document.getElementById('content');
        container.innerHTML = html;

        // Transform mermaid codeblocks into <div class="mermaid">
        var codeBlocks = container.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid');
        codeBlocks.forEach(function(codeBlock) {
          var pre = codeBlock.parentElement;
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = codeBlock.textContent.trim();
          pre.parentNode.replaceChild(div, pre);
        });

        // Run mermaid renderer
        mermaid.run({ querySelector: '.mermaid' }).catch(function(err) {
          console.warn('Mermaid rendering issue:', err);
        });

        document.getElementById('status').textContent = 'Rendered (' + rawText.length + ' chars)';
      } catch (err) {
        document.getElementById('content').innerHTML = '<div style="color:#ef4444;padding:12px;background:rgba(239,68,68,0.1);border-radius:6px;">Error rendering markdown: ' + err.message + '</div>';
      }
    }

    // Communication Bridge: listen for messages from React Native WebView
    function handleMessage(event) {
      try {
        var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data.type === 'SET_CONTENT' || data.type === 'RENDER') {
          renderMarkdown(data.content);
        }
      } catch (e) {
        // Fallback: direct string content
        if (typeof event.data === 'string' && event.data.length > 0) {
          renderMarkdown(event.data);
        }
      }
    }

    window.addEventListener('message', handleMessage);
    document.addEventListener('message', handleMessage); // For Android WebView

    // Notify React Native that plugin viewer is initialized and mounted
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'PLUGIN_READY', pluginId: 'plugin_markdown_viewer' }));
    }
  </script>
</body>
</html>
